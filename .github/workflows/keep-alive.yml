name: Keep API awake

# Render's free tier sleeps after ~15 minutes without traffic. This pings /api/health so the
# first real request doesn't hit a 30-60 s cold start.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab
#        -> New repository variable: API_URL = https://<your-service>.onrender.com
#
# Notes:
# - GitHub may delay scheduled runs by several minutes, and the shortest interval is 5 minutes.
# - GitHub pauses scheduled workflows after 60 days without repo activity; re-enable them in the Actions tab.
# - One always-awake free service uses ~744 of Render's 750 free instance hours per month.
on:
  schedule:
    # minutes 4,14,24...: GitHub is busiest on :00/:10/:20 and drops or delays runs there
    - cron: "4-59/10 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest already ships a recent Node (the script only needs fetch, Node 18+)
      - name: Wake the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: node scripts/wake-server.mjs
