# Render Blueprint: deploys the NovaCart API (Express + MongoDB)
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false` are entered in the dashboard.
services:
  - type: web
    name: novacart-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # the deployed admin URL (Vercel), used for CORS
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Clerk dashboard -> Webhooks -> your endpoint (https://<api>/api/webhooks/clerk) -> Signing secret
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      # business rules (the defaults are shown; change them here without touching code)
      - key: SUPPORT_REFUND_LIMIT
        value: 100
      - key: REFUND_APPROVAL_OVER
        value: 500
      - key: TRUSTED_AFTER_APPROVED
        value: 3
      - key: PLATFORM_FEE_PERCENT
        value: 10
      - key: PAYOUT_HOLD_HOURS
        value: 72
      # set to true once re-verification works with your Clerk instance (see README)
      - key: REQUIRE_REVERIFICATION
        value: false
